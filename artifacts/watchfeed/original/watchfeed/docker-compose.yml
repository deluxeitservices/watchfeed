services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchfeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: watchfeed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchfeed"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # WhatsApp bridge (linked device). Not exposed to the internet.
  waha:
    image: devlikeapro/waha:latest
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DOWNLOAD_MEDIA: "true"
      WHATSAPP_FILES_MIMETYPES: "image/jpeg,image/png,image/webp"
      WHATSAPP_FILES_LIFETIME: "600"
      WAHA_BASE_URL: http://waha:3000
      WAHA_PRINT_QR: "false"
      TZ: Europe/London
    volumes:
      - waha_sessions:/app/.sessions
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://watchfeed:${POSTGRES_PASSWORD}@db:5432/watchfeed
      WAHA_URL: http://waha:3000
      APP_INTERNAL_URL: http://app:8000
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      waha:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  media:
  pgdata:
  waha_sessions:
  caddy_data:
