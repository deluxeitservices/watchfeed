<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Feed</title><link rel="stylesheet" href="/static/app.css">
<style>
  .bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
  .bar input[type=search]{min-width:240px;flex:1 1 240px}.bar input.num{width:92px}
  .bar label{font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center;white-space:nowrap}
  .tablewrap table{min-width:1180px}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
  .summary{color:var(--muted);margin:0 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .message-preview{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .message-full{white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto;border:1px solid var(--line);padding:12px;border-radius:8px}
  .message-row td{background:#f8faf7}.message-row .pending-label{display:inline-block;max-width:145px;white-space:normal}
  @media(max-width:700px){.bar{padding:10px 12px}.bar input[type=search]{min-width:0}.message-preview{max-width:210px}}
</style>
</head>
<body>
<header class="top"><h1>Trading Feed</h1><nav class="nav"></nav><span class="spacer"></span><span class="meta" id="updated" role="status" aria-live="polite"></span>
  <span class="meta" id="refresh-mode" hidden></span><button id="refresh-now" type="button">Refresh now</button><span class="user"></span></header>
<div class="demo-banner" id="demo-banner" hidden>Demo preview — these are fictional sample offers. Live WhatsApp ingestion and admin controls are not enabled.</div>
<div class="bar">
  <input type="search" id="q" placeholder="Search reference, model, dealer… e.g. 126710 blnr">
  <div class="seg" id="dir"><button data-v="" class="on">All</button><button data-v="WTS">WTS</button><button data-v="WTB">WTB</button></div>
  <select id="period"><option value="6h">6 hours</option><option value="1d">1 day</option><option value="3d">3 days</option><option value="1w">1 week</option><option value="2w" selected>2 weeks</option><option value="1m">1 month</option><option value="3m">3 months</option><option value="all">All time</option></select>
  <select id="brand"><option value="">All brands</option></select>
  <select id="condition"><option value="">Any condition</option><option value="NEW">New</option><option value="LIKE_NEW">Like new</option><option value="USED">Pre-owned</option><option value="VINTAGE">Vintage</option></select>
  <select id="set_type"><option value="">Any set</option><option value="FULL_SET">Full set</option><option value="WATCH_ONLY">Watch only</option><option value="BOX_ONLY">Watch + box</option><option value="PAPERS_ONLY">Watch + papers</option></select>
  <select id="country"><option value="">All locations</option></select><select id="group"><option value="">All groups</option></select>
  <input class="num" id="min_price" type="number" placeholder="Min £"><input class="num" id="max_price" type="number" placeholder="Max £"><input class="num" id="year_from" type="number" placeholder="Year ≥">
  <label><input type="checkbox" id="deals_only"> Deals only</label><label><input type="checkbox" id="priced_only"> Priced only</label>
  <label><input type="checkbox" id="hide_handled"> Hide handled</label><label><input type="checkbox" id="show_blocked"> Show blocked</label>
  <button id="reset">Reset</button><button class="primary" id="savealert">🔔 Save as alert</button>
</div>
<main><div class="summary"><span id="count">Loading…</span></div><div class="tablewrap"><table><thead><tr>
  <th>Photo</th><th data-sort="last_seen">Seen</th><th>Type</th><th data-sort="brand">Model &amp; reference</th><th>Condition</th><th>Set</th><th data-sort="year">Year</th>
  <th>Original price</th><th data-sort="price" id="basehead">Price £</th><th data-sort="deal">vs market</th><th>Dealer</th><th>Location</th><th data-sort="seen_count">Posts</th><th>Status</th>
</tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>No offers match these filters.</div></div>
<div class="pager"><span class="small muted" id="range"></span><button id="prev">‹ Prev</button><button id="next">Next ›</button></div></main>
<script src="/static/common.js"></script>
<script>
renderNav("/");
let state={page:1,sort:"last_seen",order:"desc",total:0,pageSize:50,direction:""};
let latestLoad=0, autoLoadRunning=false, isAdminViewer=false, autoEnabled=false;
const AUTO_REFRESH_MS=60*60*1000;
const MESSAGE_REFRESH_MS=2*60*1000;
let nextAutoRefreshAt=Date.now()+AUTO_REFRESH_MS;
let lastMessageRefreshAt=Date.now();
const FILTERS=["period","brand","condition","set_type","country","group","min_price","max_price","year_from"], CHECKS=["deals_only","priced_only","hide_handled","show_blocked"];
function params(){const p=new URLSearchParams(),v=id=>$(id).value.trim();if(v("q"))p.set("q",v("q"));if(state.direction)p.set("direction",state.direction);
  FILTERS.forEach(k=>{if(v(k))p.set(k,v(k));});CHECKS.forEach(k=>{if($(k).checked)p.set(k,"true");});
  p.set("sort",state.sort);p.set("order",state.order);p.set("page",state.page);p.set("page_size",state.pageSize);p.set("include_messages","true");return p;}
function row(o){
  if(o.kind==="message"){
    const directions=o.directions||[];
    return `<tr class="message-row"><td>—</td>
      <td title="${esc(new Date(o.last_seen_at).toLocaleString("en-GB"))}">${ago(o.last_seen_at)}</td>
      <td title="${directions.length?"Inferred from message text, not AI-confirmed":""}">${directions.length?
        directions.map(d=>`<span class="badge dir ${esc(d)}">${esc(d)}</span>`).join(" "):"—"}
        ${directions.length?'<div class="small muted">Provisional</div>':""}</td>
      <td><div class="message-preview" title="${esc(o.preview)}">${esc(o.preview || "—")}</div><div class="small muted">${esc(o.group)}</div></td>
      <td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>
      <td>${esc(o.sender_name || "—")}${o.sender_phone?`<div class="small">${esc("+"+o.sender_phone)}</div>`:""}</td>
      <td>—</td><td>—</td>
      <td><span class="badge pending-label">${esc(o.display_status)}</span><div><button class="linkish small" data-message="${o.id}">View message</button></div></td></tr>`;
  }
  const title=[o.brand,o.family,o.model].filter(Boolean).join(" · "),details=[o.dial_color&&`${o.dial_color} dial`,o.case_material,o.bracelet,o.diamond_indices&&"diamond indices"].filter(Boolean);
  const fresh=Date.now()-new Date(o.last_seen_at)<3600e3,date=o.year?(o.month?`${String(o.month).padStart(2,"0")}/${o.year}`:o.year):"";
  const disc=o.discount_pct!=null?`<div class="small muted">${o.discount_pct>0?"+":""}${o.discount_pct}% vs retail</div>`:"";
  const mk=o.market_pct!=null?`<div class="small muted">${o.market_pct>0?"+":""}${Math.round(o.market_pct*100)}%</div>`:"";
  return `<tr><td>${thumbCell(o)}</td><td class="${fresh?"fresh":""}" title="${esc(new Date(o.last_seen_at).toLocaleString("en-GB"))}">${ago(o.last_seen_at)}</td>
    <td><span class="badge dir ${esc(o.direction)}">${esc(o.direction)}</span>${o.in_stock?`<div><span class="badge stockb">In our stock</span></div>`:""}</td>
    <td>${o.reference_norm?`<button class="linkish ref" data-ref="${esc(o.reference_norm)}">${esc(o.reference)}</button>`:`<div class="ref">—</div>`}<div>${esc(title)}</div><div class="small">${details.map(d=>`<span class="chip">${esc(d)}</span>`).join("")}</div>${o.notes?`<div class="small muted">${esc(o.notes)}</div>`:""}</td>
    <td>${esc(COND[o.condition]||"")}</td><td>${esc(SETS[o.set_type]||"")}</td><td>${esc(date)}</td>
    <td class="price">${o.price!=null?esc(money(o.price,o.currency)):""}${disc}</td><td class="base">${o.price_base!=null?esc(money(o.price_base)):""}</td><td>${dealBadge(o)}${o.deal?"":mk}</td>
    <td>${o.dealer_key?`<button class="linkish" data-dealer="${esc(o.dealer_key)}">${esc(o.dealer_name||"Dealer")}</button>`:esc(o.dealer_name||"")}${ratingBadge(o.dealer_rating)}<div class="small">${o.dealer_phone?`<a href="https://wa.me/${esc(o.dealer_phone)}" target="_blank" rel="noopener">+${esc(o.dealer_phone)}</a>`:""}</div></td>
    <td>${flag(o.country)} ${esc(o.city||o.country||"")}</td><td title="${esc((o.groups||[]).join(", "))}">${o.seen_count>1?`×${o.seen_count}`:"1"}<div class="small muted">${(o.groups||[]).length} grp</div></td>
    <td>${trackBadge(o.track)}<div><button class="linkish small" data-offer="${o.id}">Open</button></div></td></tr>`;
}
async function load(resetHourlyTimer=true){const request=++latestLoad;try{const d=await api("/api/offers?"+params());if(request!==latestLoad)return;state.total=d.total;$("rows").innerHTML=d.items.map(row).join("");$("empty").hidden=d.items.length>0;
  $("count").textContent=`${d.total.toLocaleString("en-GB")} feed entries`;const start=d.total?(state.page-1)*state.pageSize+1:0;$("range").textContent=`${start}–${Math.min(state.page*state.pageSize,d.total)} of ${d.total}`;
  lastMessageRefreshAt=Date.now();
  if(resetHourlyTimer)nextAutoRefreshAt=Date.now()+AUTO_REFRESH_MS;
  $("prev").disabled=state.page<=1;$("next").disabled=state.page*state.pageSize>=d.total;$("updated").textContent=PREVIEW_MODE?"Sample data":"Feed checked "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}catch(e){if(request===latestLoad){$("count").textContent="Error loading feed: "+e.message;$("updated").textContent="Refresh failed";}}}
async function openMessage(id){
  const body=modal("Original WhatsApp message","<p class='muted'>Loading…</p>");
  try{
    const m=await api(`/api/messages/${id}`);
    if(!body.isConnected)return;
    body.innerHTML=`<div class="small muted">Group: ${esc(m.group)} · ${esc(new Date(m.timestamp).toLocaleString("en-GB"))}</div>
      <p><strong>Sender:</strong> ${esc(m.sender_name||"Unavailable")}<br>
      <strong>Mobile:</strong> ${m.sender_phone?esc("+"+m.sender_phone):"Unavailable"}<br>
      <strong>Status:</strong> ${esc(m.display_status)}</p>
      <div class="message-full">${esc(m.text)}</div>`;
  }catch(e){if(body.isConnected)body.textContent="Could not load message: "+e.message;}
}
$("rows").addEventListener("click",e=>{const button=e.target.closest("[data-message]");if(button)openMessage(button.dataset.message);});
async function loadFacets(){const f=await api("/api/facets");BASE=f.base_currency; $("basehead").textContent=`Price ${BASE}`;$("min_price").placeholder=`Min ${BASE}`;$("max_price").placeholder=`Max ${BASE}`;
  f.brands.forEach(b=>$("brand").insertAdjacentHTML("beforeend",`<option>${esc(b)}</option>`));f.countries.forEach(c=>$("country").insertAdjacentHTML("beforeend",`<option value="${esc(c)}">${flag(c)} ${esc(c)}</option>`));f.groups.forEach(g=>$("group").insertAdjacentHTML("beforeend",`<option value="${esc(g.id)}">${esc(g.name)}</option>`));}
let t;const reload=()=>{state.page=1;clearTimeout(t);t=setTimeout(load,250);};$("q").addEventListener("input",reload);
document.querySelectorAll(".bar select,.bar input:not(#q)").forEach(el=>el.addEventListener("change",reload));
$("dir").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("dir").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));state.direction=b.dataset.v;reload();});
document.querySelectorAll("th[data-sort]").forEach(th=>th.addEventListener("click",()=>{const s=th.dataset.sort;state.order=state.sort===s?(state.order==="desc"?"asc":"desc"):(s==="deal"||s==="price"?"asc":"desc");state.sort=s;reload();}));
$("prev").onclick=()=>{state.page--;load();};$("next").onclick=()=>{state.page++;load();};
$("reset").onclick=()=>{document.querySelectorAll(".bar input").forEach(i=>i.type==="checkbox"?i.checked=false:i.value="");document.querySelectorAll(".bar select").forEach(s=>s.selectedIndex=0);$("period").value="2w";$("dir").querySelector("button").click();};
$("savealert").onclick=async()=>{if(await isPreview()){toast("Alerts are disabled in demo preview.");return;}const p=Object.fromEntries(params());["sort","order","page","page_size","period","hide_handled","show_blocked"].forEach(k=>delete p[k]);if(!Object.keys(p).length){toast("Set a search or filters first.");return;}
  const b=modal("Save alert",`<p class="small muted">Notify me when a listing matches these filters.</p><label>Alert name</label><input id="aname" style="width:100%" value="${esc(p.q||p.brand||"My alert")}"><label>Email (optional)</label><input id="aemails" style="width:100%"><label><input type="checkbox" id="atg" checked> Send to staff Telegram</label><div class="row"><button class="primary" id="acreate">Save alert</button><a href="/alerts">Manage alerts →</a></div>`);
  $("acreate").onclick=async()=>{try{await api("/api/alerts","POST",{name:$("aname").value,query:p,emails:$("aemails").value,telegram:$("atg").checked});modal.close();toast("Alert saved");}catch(e){toast(e.message);}};};
document.addEventListener("offer-updated",load);
async function syncRefreshSetting(){
  try{
    const me=await api("/api/me");
    isAdminViewer=!!me.is_admin;
    const wasEnabled=autoEnabled;
    autoEnabled=isAdminViewer&&!!me.feed_auto_refresh;
    if(autoEnabled&&!wasEnabled)nextAutoRefreshAt=Date.now()+AUTO_REFRESH_MS;
    $("refresh-mode").hidden=!isAdminViewer;
    if(isAdminViewer)$("refresh-mode").textContent=autoEnabled
      ?"Hourly refresh on · New message checks every 2 min"
      :"Hourly refresh off · New message checks every 2 min";
  }catch(e){autoEnabled=false;$("refresh-mode").hidden=true;}
}
async function autoRefresh(){
  if(autoLoadRunning||!autoEnabled||document.hidden||Date.now()<nextAutoRefreshAt||($("modal")&&$("modal").open))return;
  autoLoadRunning=true;
  nextAutoRefreshAt=Date.now()+AUTO_REFRESH_MS;
  try{await load();}finally{autoLoadRunning=false;}
}
// Check even when the visible page contains only offers: new WAHA messages can arrive anytime.
async function checkIncoming(){
  if(autoLoadRunning||document.hidden||Date.now()-lastMessageRefreshAt<MESSAGE_REFRESH_MS
      ||($("modal")&&$("modal").open))return;
  autoLoadRunning=true;
  try{await load(false);}finally{autoLoadRunning=false;}
}
setInterval(()=>{checkIncoming();autoRefresh();},60000);
setInterval(()=>{if(isAdminViewer&&!document.hidden)syncRefreshSetting();},60000);
async function resumeRefresh(){if(document.hidden)return;if(isAdminViewer)await syncRefreshSetting();await checkIncoming();autoRefresh();}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resumeRefresh();});
window.addEventListener("focus",resumeRefresh);
$("refresh-now").addEventListener("click",async()=>{
  const button=$("refresh-now");button.disabled=true;button.textContent="Refreshing…";
  try{await load();}finally{button.disabled=false;button.textContent="Refresh now";}
});
previewReady.then(demo=>{if(!demo)syncRefreshSetting();});
const offer=new URLSearchParams(location.search).get("offer");if(offer)isPreview().then(demo=>{if(!demo)openOffer(offer);});
loadFacets().catch(()=>{}).finally(load);
</script>
</body>
</html>
